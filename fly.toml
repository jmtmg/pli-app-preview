# Fly.io — déploiement staging mode Cloud
app = "pli-staging"
primary_region = "cdg"  # Paris

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PLI_MODE = "cloud"
  PLI_BASE_URL = "https://staging.pli.app"
  PLI_APP_URL = "https://staging.pli.app"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "2s"

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Secrets à configurer via : fly secrets set NAME=value
# - PLI_DATABASE_URL          (Neon ou Supabase)
# - PLI_SECRET_KEY            (openssl rand -base64 64)
# - PLI_CLOUD_CRYPTO_KEY      (Fernet.generate_key())
# - PLI_S3_ENDPOINT_URL       (R2 / Scaleway)
# - PLI_S3_ACCESS_KEY
# - PLI_S3_SECRET_KEY
# - PLI_S3_BUCKET
# - PLI_STRIPE_SECRET_KEY
# - PLI_STRIPE_WEBHOOK_SECRET
# - PLI_STRIPE_PRICE_MONTHLY
# - PLI_STRIPE_PRICE_YEARLY
# - PLI_EMAIL_PROVIDER        (sendgrid | postmark)
# - PLI_EMAIL_API_KEY
# - PLI_EMAIL_FROM            (noreply@pli.app)
