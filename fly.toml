# Fly.io — déploiement staging mode Cloud
app = "pli-staging"
primary_region = "cdg"  # Paris

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PLI_MODE = "cloud"
  PLI_ENABLE_M2 = "false"
  PLI_BASE_URL = "https://staging.pli.app"
  PLI_APP_URL = "https://staging.pli.app"
  PLI_CORS_ORIGINS = "[\"https://staging.pli.app\"]"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "2s"

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Secrets à configurer uniquement après approbation, via le secret manager / Fly
# secrets import. Ne pas passer les valeurs en clair dans l'historique shell.
# Template préparatoire : .env.staging.example ; runbook : docs/runbooks/cloud-staging.md
# - PLI_DATABASE_URL          (PostgreSQL staging managé)
# - PLI_SECRET_KEY            (secret applicatif long, généré hors logs)
# - PLI_CLOUD_CRYPTO_KEY      (clé Fernet cloud, générée hors logs)
# - PLI_S3_ENDPOINT_URL       (R2 / Scaleway / S3)
# - PLI_S3_ACCESS_KEY
# - PLI_S3_SECRET_KEY
# - PLI_S3_BUCKET
# - PLI_EMAIL_PROVIDER        (smtp | sendgrid | postmark)
# - PLI_EMAIL_API_KEY         (si provider API)
# - PLI_EMAIL_SMTP_*          (si SMTP)
# - PLI_EMAIL_FROM            (ex: noreply@pli.app)
# - PLI_GMAIL_CLIENT_ID
# - PLI_GMAIL_CLIENT_SECRET
# - PLI_GMAIL_REDIRECT_URI    (https://staging.pli.app/auth/gmail/callback)
# - PLI_MS_CLIENT_ID
# - PLI_MS_CLIENT_SECRET
# - PLI_MS_REDIRECT_URI       (https://staging.pli.app/auth/microsoft/callback)
