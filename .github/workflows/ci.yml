name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verified-gates:
    name: verified-gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[m2,dev]'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate local-v1 environment
        run: make local-v1-env

      - name: Preflight local-v1
        run: make BACKEND_PY=python local-v1-preflight

      - name: Backend tests
        run: make BACKEND_PY=python test-be

      - name: Backend lint
        run: make BACKEND_PY=python lint-be

      - name: Typecheck backend and frontend
        run: make BACKEND_PY=python typecheck

      - name: Frontend tests
        run: make test-fe

      - name: Frontend lint
        run: make lint-fe

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Docker Compose config
        run: docker compose -f docker-compose.yml config

      - name: Docker backend image build
        run: docker build -f backend/Dockerfile -t pli-backend:ci .
