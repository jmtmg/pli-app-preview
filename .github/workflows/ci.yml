name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pli
          POSTGRES_PASSWORD: pli
          POSTGRES_DB: pli_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pli"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      matrix:
        mode: [local, cloud]
    env:
      PLI_MODE: ${{ matrix.mode }}
      PLI_DATABASE_URL: postgresql://pli:pli@localhost:5432/pli_test
      PLI_SECRET_KEY: ci-test-secret
      PLI_CLOUD_CRYPTO_KEY: S9bHVMfIgDZF2XQm-P_C7nl8VEa5dT_4cSOehLZ6Y4w=
      PLI_STRIPE_SECRET_KEY: sk_test_dummy
      PLI_STRIPE_WEBHOOK_SECRET: whsec_test_dummy
      PLI_EMAIL_PROVIDER: memory
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check pli tests

      - name: Format check
        run: ruff format --check pli tests

      - name: Typecheck (mypy)
        run: mypy pli

      - name: Alembic migrate (cloud only)
        if: matrix.mode == 'cloud'
        run: alembic upgrade head

      - name: Test (pytest)
        run: pytest -q --cov=pli --cov-report=term-missing --cov-report=xml --cov-fail-under=70 --junitxml=junit.xml

      - name: Security — isolation tenant
        if: matrix.mode == 'cloud'
        run: pytest tests/test_tenancy_isolation.py -v --no-cov

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ matrix.mode }}
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test (vitest)
        run: npm run test -- --run --coverage
      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -e ".[dev]" bandit pip-audit
          bandit -r pli -ll
          pip-audit --strict
