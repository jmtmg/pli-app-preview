            const u = new URL(url, location.origin);
            if (u.pathname === '/conversations' && u.searchParams.get('filter') === 'humans'){

            }
          }catch(e){ /* ignore parsing errors and fallthrough to real fetch */ }
          return realFetch(input, init);
        };
      }catch(e){ /* older browsers — no-op */ }
    })();
