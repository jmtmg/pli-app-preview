[project]
name = "pli-backend"
version = "0.1.0"
description = "PLI — client mail conversationnel · backend FastAPI (Local+Cloud)"
authors = [{ name = "Abscisse SAS", email = "jm@abscisse.fr" }]
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
  # Web framework
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "email-validator>=2.2.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",

  # Auth / OAuth
  "authlib>=1.3.2",
  "itsdangerous>=2.2.0",
  "cryptography>=43.0.0",

  # DB
  "sqlalchemy>=2.0.35",
  "alembic>=1.13.0",

  # Mail parsing
  "mail-parser>=3.15.0",
  "beautifulsoup4>=4.12.0",
  "html2text>=2024.2.26",

  # Providers
  "google-api-python-client>=2.148.0",
  "google-auth-oauthlib>=1.2.1",
  "msgraph-sdk>=1.10.0",

  # Utils
  "python-dateutil>=2.9.0",
  "tenacity>=9.0.0",  # retry / backoff
  "structlog>=24.4.0",
]

[project.optional-dependencies]
# Dépendances M2 : auth PLI (JWT + Argon2), billing Stripe, licences Ed25519,
# storage cloud PostgreSQL. Regroupées en extra pour que `pip install -e .`
# en mode local (Sprint 1 / M1) ne pull pas `asyncpg` ni `stripe` (critère
# d'acceptation #3 du ticket `M1-regression-m2.md` : pas de nouvelle
# dépendance Postgres au boot mode local). Activation CI / staging :
#   pip install -e '.[m2]'   # ou .[m2,dev]
m2 = [
  "pyjwt>=2.9.0",
  "argon2-cffi>=23.1.0",
  "stripe>=11.0.0",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.10",
  "jinja2>=3.1.4",
  "python-ulid>=3.0.0",
  "tomli_w>=1.0.0",
]

# SQLCipher support is optional in dev: local mode falls back to stdlib sqlite3
# when PLI_SQLCIPHER_KEY is unset or pysqlcipher3 is unavailable.
sqlcipher = [
  "pysqlcipher3>=1.2.0; platform_system != 'Windows'",
]

dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.7.0",
  "mypy>=1.11.0",
  "factory-boy>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RET"]
ignore = ["E501"]

# FastAPI / Pydantic : Depends(), Header(), Query()... dans des signatures
# de routes sont idiomatiques. Sans cette config ruff les flag a tort en B008.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Cookie",
    "fastapi.Security",
]

# Scaffolds M2+ (billing, GDPR, OCR, auth_pli, beta, emails, licensing,
# tenancy, crypto.attachments/backups, adapters) : nettoyage reporte au
# sprint qui active chaque module. On ignore par module pour ne pas masquer
# de regression dans notre code Sprint 1.
[tool.ruff.lint.per-file-ignores]
"pli/adapters/base.py" = ["N818"]
"pli/adapters/local.py" = ["SIM105"]
"pli/api/auth_pli.py" = ["B904", "F841"]
"pli/api/invitations.py" = ["B904"]
"pli/auth/**" = ["B904", "N818"]  # ex-pli/auth_pli/** (renommé 2026-04-22, T2.1)
"pli/billing/**" = ["B904", "UP042", "RET504"]
"pli/gdpr/**" = ["B904", "N818", "RET504", "F841", "UP042"]
"pli/ocr/**" = ["B904", "UP042"]
"pli/beta/**" = ["B904"]
"pli/licensing/**" = ["B904", "N818"]
"pli/tenancy/**" = ["N818"]
"pli/emails/**" = ["SIM105"]
"pli/crypto/attachments.py" = ["B904", "RET504"]
"pli/crypto/backups.py" = ["B904"]
"tests/**" = ["F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=pli --cov-report=term-missing --cov-fail-under=70"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
