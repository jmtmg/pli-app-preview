<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ subject }}</title>
<style>
  body { margin:0; padding:0; background:#f5f7fb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:#1f2430; }
  .wrap { max-width:560px; margin:0 auto; padding:32px 16px; }
  .card { background:#ffffff; border-radius:12px; padding:32px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .brand { font-weight:700; font-size:20px; letter-spacing:-0.01em; color:#3b5bdb; margin-bottom:24px; }
  h1 { font-size:22px; margin:0 0 16px 0; }
  p { line-height:1.55; margin:0 0 14px 0; font-size:15px; }
  .btn { display:inline-block; background:#3b5bdb; color:#fff !important; text-decoration:none; padding:12px 22px; border-radius:8px; font-weight:600; margin:18px 0; }
  .muted { color:#687087; font-size:13px; }
  .footer { text-align:center; color:#8a93a6; font-size:12px; margin-top:24px; }
  code { background:#f0f2f7; padding:2px 6px; border-radius:4px; font-size:13px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">PLI</div>
      {{ body | safe }}
      <p class="muted">Besoin d'aide ? Répondez simplement à cet email.</p>
    </div>
    <div class="footer">
      PLI — Mail conversationnel · <a href="{{ app_url }}">{{ app_url }}</a><br>
      Cet email vous est envoyé parce qu'une action a été demandée sur votre compte PLI.
    </div>
  </div>
</body>
</html>
